name: privatelm
description: PrivateLM — run LLMs on your phone or a phone cluster and serve them over an OpenAI-compatible API
publish_to: "none"
version: 1.1.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Persistent Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local AI Inference (Android)
  llama_flutter_android: ^0.2.0

  # Secure storage for API keys (Keystore / Keychain)
  flutter_secure_storage: ^9.2.4

  # Networking
  crypto: ^3.0.6
  dio: ^5.7.0
  http: ^1.2.0

  # File System & Permissions
  path_provider: ^2.1.0

  # Image Support
  image_picker: ^1.1.0
  share_plus: ^10.0.0

  # UI
  flutter_markdown: ^0.7.4

  # Utils
  uuid: ^4.5.0

  # Misc
  file_picker: ^11.0.2
  image: ^4.8.0
  gal: ^2.3.2
  speech_to_text: ^7.0.0
  package_info_plus: ^9.0.1
  device_info_plus: ^12.4.0
  archive: ^4.0.9
  xml: ^6.6.1
  pdfrx: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  llama_flutter_android:
    path: local_plugins/llama_flutter_android

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/FiraCode-OFL.txt

  # Fonts are bundled so the app never downloads them from Google at runtime.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-Medium.ttf
          weight: 500
