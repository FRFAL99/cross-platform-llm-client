name: Release

# One-click release: Actions > Release > Run workflow.
# Bumps `version:` in pubspec.yaml (name and build number), commits it to
# main, tags vX.Y.Z and starts the Android workflow on that tag, which builds
# the APKs signed with the release key and publishes the GitHub Release that
# the in-app updater reads. Each release installs over the previous one.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version instead (e.g. 1.2.0), optional
        type: string
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Release key configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. Run scripts/create_release_key.sh once (README, Releases)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          current=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//')
          name="${current%%+*}"
          build="${current#*+}"
          [ "$build" != "$current" ] || build=0
          IFS=. read -r major minor patch <<< "$name"
          if [ -n "$EXACT" ]; then
            new="${EXACT#v}"
            if ! [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must look like 1.2.3, got '$EXACT'"
              exit 1
            fi
          else
            case "$BUMP" in
              major) new="$((major + 1)).0.0" ;;
              minor) new="$major.$((minor + 1)).0" ;;
              *) new="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::Tag v$new already exists"
            exit 1
          fi
          # Android refuses an update whose versionCode is not higher.
          code=$((build + 1))
          sed -i -E "s/^version:.*/version: $new+$code/" pubspec.yaml
          echo "Version $current -> $new+$code"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "OneLM ${TAG#v}"
          git push origin HEAD:main
          git push origin "$TAG"

      # A tag pushed with GITHUB_TOKEN starts no workflow, but a dispatch
      # does: the Android workflow builds and publishes the release.
      - name: Start the build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "### $TAG tagged" >> "$GITHUB_STEP_SUMMARY"
          echo "The Android workflow is building it; the release appears in about 30-60 minutes." >> "$GITHUB_STEP_SUMMARY"
